name: document-methods-spike

on:
  pull_request:
    paths:
      - 'experiments/document-methods/**'
      - '.agents/skills/document-evidence-demo/**'
      - '.github/workflows/document-methods-spike.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated parser experiment dependencies
        run: python -m pip install -r experiments/document-methods/requirements.txt
      - name: Generate and verify synthetic PDF and DOCX
        working-directory: experiments/document-methods
        run: |
          python generate_fixtures.py
          python probe.py --method methods.json --out result.json --verify
