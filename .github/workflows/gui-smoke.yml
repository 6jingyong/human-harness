name: gui-smoke
on:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
        env:
          CI: 'true'
          HH_EXECUTOR: demo
          HH_DATA_DIR: ${{ runner.temp }}/human-harness-gui-smoke
      - name: Verify a project handoff through the native Codex app-server
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hh-native-tools" --no-audit --no-fund @openai/codex@0.171.0
          export HH_CODEX_COMMAND="$RUNNER_TEMP/hh-native-tools/node_modules/.bin/codex"
          "$HH_CODEX_COMMAND" --version
          "$HH_CODEX_COMMAND" mcp add hh_smoke -- node "$GITHUB_WORKSPACE/tests/fixtures/read-only-mcp-server.mjs"
          npm run test:codex:mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-harness-gui-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
